<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Crunch My Butter">
  <defs>
    <linearGradient id="cmbButter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="55%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#FFB000"/>
    </linearGradient>
    <radialGradient id="cmbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B6BE4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1341A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#1341A8"/>
  <circle cx="32" cy="32" r="24" fill="url(#cmbGlow)"/>

  <!-- butter stick body -->
  <rect x="12" y="20" width="40" height="24" rx="5"
        fill="url(#cmbButter)" stroke="#0B2A6B" stroke-width="2.5"/>
  <!-- top highlight -->
  <rect x="16" y="23.5" width="32" height="5" rx="2.5" fill="#FFF3C4" opacity="0.75"/>
  <!-- paper wrap band -->
  <rect x="28.5" y="20" width="7" height="24" fill="#FFF3C4" opacity="0.55"/>
  <line x1="28.5" y1="20" x2="28.5" y2="44" stroke="#0B2A6B" stroke-width="1.6" opacity="0.7"/>
  <line x1="35.5" y1="20" x2="35.5" y2="44" stroke="#0B2A6B" stroke-width="1.6" opacity="0.7"/>

  <!-- crunch crack line across the top surface -->
  <polyline points="17,32 22,26.5 27,33 33,26 39,33 45,27"
            fill="none" stroke="#0B2A6B" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flying chips -->
  <rect x="8" y="14" width="5" height="4.5" rx="1.4" fill="#FFDD00" stroke="#0B2A6B" stroke-width="1.4" transform="rotate(-22 10.5 16.2)"/>
  <rect x="50" y="15" width="5" height="4.5" rx="1.4" fill="#FFC400" stroke="#0B2A6B" stroke-width="1.4" transform="rotate(18 52.5 17.2)"/>
  <rect x="46" y="46" width="4.5" height="4" rx="1.3" fill="#FFDD00" stroke="#0B2A6B" stroke-width="1.3" transform="rotate(28 48 48)"/>

  <!-- sparkle -->
  <path d="M50 8 L51.6 12 L55.6 13.6 L51.6 15.2 L50 19.2 L48.4 15.2 L44.4 13.6 L48.4 12 Z" fill="#FFF3C4"/>
</svg>
